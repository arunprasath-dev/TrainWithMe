name: Diagnose build

# TEMPORARY: the sandbox cannot download job logs, so this workflow posts the compiler output of a
# failing build as a PR comment. It is deleted once the build is green.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Compile
        id: compile
        continue-on-error: true
        run: |
          set +e
          ./gradlew :app:assembleDebug --continue --stacktrace > build.log 2>&1
          echo "status=$?" >> "$GITHUB_OUTPUT"

      - name: Publish errors
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          {
            echo "### Build diagnostics (run ${{ github.run_id }})"
            echo '```'
            grep -E "^(e: |w: .*error|FAILURE|\* What went wrong|> Task .* FAILED|Caused by)" build.log | head -120 || true
            echo '```'
          } > comment.md
          if [ -n "$PR" ]; then gh pr comment "$PR" --body-file comment.md; fi
          cat comment.md
