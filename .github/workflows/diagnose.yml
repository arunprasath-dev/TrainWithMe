name: Diagnose build

# TEMPORARY: the sandbox cannot download job logs, so this workflow posts the failing compile /
# test / lint output as a PR comment. It is deleted once the build is green.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Compile
        continue-on-error: true
        run: ./gradlew :app:assembleDebug --continue --stacktrace > compile.log 2>&1 || true

      - name: Unit tests
        continue-on-error: true
        run: ./gradlew testDebugUnitTest --continue --stacktrace > test.log 2>&1 || true

      - name: Lint
        continue-on-error: true
        run: ./gradlew :app:lintDebug --continue --stacktrace > lint.log 2>&1 || true

      - name: Publish diagnostics
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          {
            echo "### Build diagnostics (run ${{ github.run_id }})"
            for f in compile test lint; do
              echo "#### $f"
              echo '```'
              grep -E "^(e: |FAILED|FAILURE|\* What went wrong|> Task .* FAILED)|tests? completed|There were failing tests|^[A-Za-z0-9_.]+ > .* FAILED|Lint found|Error: " "$f.log" 2>/dev/null | head -60 || true
              echo '```'
            done
          } > comment.md
          if [ -n "$PR" ]; then gh pr comment "$PR" --body-file comment.md; fi
          cat comment.md
