name: Diagnose build

# TEMPORARY: the sandbox cannot download job logs, so this workflow posts the failing compile /
# test / lint output as a PR comment. It is deleted once the build is green.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Compile
        continue-on-error: true
        run: ./gradlew :app:assembleDebug --continue --stacktrace > compile.log 2>&1 || true

      - name: Unit tests
        continue-on-error: true
        run: ./gradlew testDebugUnitTest --continue --stacktrace > test.log 2>&1 || true

      - name: Lint
        continue-on-error: true
        run: ./gradlew :app:lintDebug --continue --stacktrace > lint.log 2>&1 || true

      - name: Publish diagnostics
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          {
            echo "### Build diagnostics (run ${{ github.run_id }})"
            echo "#### compile"
            echo '```'
            grep -E "^e: |> Task .* FAILED" compile.log 2>/dev/null | head -40 || true
            echo '```'
            echo "#### test failures"
            echo '```'
            RESULTS=$(find . -path "*/test-results/*" -name "*.xml" | head -20)
            for xml in $RESULTS; do
              echo "== $xml"
              grep -o -E '<testcase name="[^"]*"|<failure message="[^"]{0,300}' "$xml" | head -30 || true
            done
            echo '```'
            echo "#### lint"
            echo '```'
            grep -E "What went wrong|Caused by|Exception|Error:|Lint found|\.xml:[0-9]+" -A3 lint.log 2>/dev/null | head -50 || true
            echo '```'
          } > comment.md
          if [ -n "$PR" ]; then gh pr comment "$PR" --body-file comment.md; fi
          head -c 3000 comment.md
