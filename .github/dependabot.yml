# Keeps the Gradle plugins, AndroidX/Compose libraries and GitHub Actions used by CI current.
version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      androidx:
        patterns:
          - 'androidx.*'
      kotlin-and-compose:
        patterns:
          - 'org.jetbrains.kotlin*'
          - 'com.google.devtools.ksp*'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
